services:
  cluestate:
    build: .
    container_name: cluestate-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://cluestate:cluestate@db:5432/cluestate
      - LLM_MODEL=openai/gpt-4o-mini
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOG_LEVEL=info
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: cluestate-db
    environment:
      POSTGRES_USER: cluestate
      POSTGRES_PASSWORD: cluestate
      POSTGRES_DB: cluestate
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cluestate"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
