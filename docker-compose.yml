services:
  cluestate:
    build: .
    container_name: cluestate-app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg://cluestate:${POSTGRES_PASSWORD:-cluestate_dev_password}@db:5432/cluestate
      - LLM_MODEL=${LLM_MODEL:-openai/gpt-4o-mini}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-change-this-secret-in-production}
      - CORS_ORIGINS=${CORS_ORIGINS:-https://app.cluestate.com,https://cluestate.com,http://localhost:8000,http://localhost:5173}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    container_name: cluestate-db
    environment:
      POSTGRES_USER: cluestate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cluestate_dev_password}
      POSTGRES_DB: cluestate
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cluestate"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
