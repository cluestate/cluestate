[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cluestate"
version = "0.1.0"
description = "ClueState — Evidence-backed customer and entity intelligence infrastructure."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    { name = "ClueState Contributors" },
]
keywords = ["ai", "memory", "entity", "intelligence", "llm", "cluestate", "knowledge-extraction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.0",
    "aiosqlite>=0.20.0",
    "litellm>=1.40.0",
    "instructor>=1.5.0",
    "pydantic-settings>=2.0.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "httpx>=0.27.0",
]

[project.scripts]
cluestate = "cluestate.cli:cli"

[project.urls]
Homepage = "https://cluestate.com"
Documentation = "https://github.com/cluestate/cluestate#readme"
Repository = "https://github.com/cluestate/cluestate"

[tool.hatch.build.targets.wheel]
packages = ["src/cluestate"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E712"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
