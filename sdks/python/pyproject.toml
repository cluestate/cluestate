[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cluestate-sdk"
version = "0.1.0"
description = "ClueState Python SDK — Evidence-backed customer and entity intelligence infrastructure."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    { name = "ClueState Contributors" },
]
keywords = ["cluestate", "customer-intelligence", "entity-state", "sdk", "ai"]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.urls]
Homepage = "https://cluestate.com"
Documentation = "https://github.com/cluestate/cluestate/blob/main/docs/python-sdk.md"
Repository = "https://github.com/cluestate/cluestate"

[tool.hatch.build.targets.wheel]
packages = ["src/cluestate_sdk"]

